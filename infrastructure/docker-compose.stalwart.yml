# ==============================================================================
# STALWART ALL-IN-ONE MAIL SERVER DOCKER COMPOSE CONFIGURATION
# High-performance, memory-efficient (<100MB RAM), secure Rust-based mail server
# Replaces heavy multi-container Mailu 2.0 with a single, modern container.
#
# Protocols supported:
# - SMTP (25, 465, 587)
# - IMAP / IMAPS (143, 993)
# - JMAP (JSON Mail Access Protocol)
# - ManageSieve (4190)
# - Built-in DKIM, SPF, DMARC, ARC signing & validation
# - Built-in Web Admin UI & REST API on port 8081
# ==============================================================================

services:
  stalwart-mail:
    image: stalwartlabs/stalwart:latest
    container_name: stalwart-mail
    restart: unless-stopped
    init: true
    environment:
      # Master administrator credentials generated by server wizard
      - STALWART_RECOVERY_ADMIN=admin:jhoqEX3TrBmqrfi6
      # Normal production operational mode (all SMTP/IMAP/JMAP listeners active)
      # Set STALWART_RECOVERY_MODE=1 only if emergency WebUI recovery without mail services is required
      - STALWART_RECOVERY_MODE=0
      # Server public hostname
      - STALWART_PUBLIC_URL=http://${MAIL_DOMAIN:-localhost:8081}
      - STALWART_HOSTNAME=${MAIL_DOMAIN:-localhost}
    ports:
      # --- HTTP / Management REST API / Admin WebUI ---
      # Mapped to 8081 on host to avoid conflict with Nginx web app (port 8080)
      - "8081:8080"
      
      # --- SMTP Mail Transfer ---
      - "25:25"         # Standard SMTP (server-to-server)
      - "465:465"       # SMTPS (Implicit TLS)
      - "587:587"       # SMTP Submission (STARTTLS)
      - "2525:587"      # Alternative Submission (when port 587 is blocked by ISP)

      # --- IMAP Mail Access ---
      - "143:143"       # IMAP (STARTTLS)
      - "993:993"       # IMAPS (Implicit TLS)

      # --- ManageSieve ---
      - "4190:4190"     # Sieve mail filtering rules
    volumes:
      # Persistent mail storage, accounts, and directory database
      - stalwart-data:/var/lib/stalwart
      # Configuration files and DKIM keys
      - stalwart-etc:/etc/stalwart
    networks:
      - exoin-net

networks:
  exoin-net:
    name: infrastructure_exoin-net
    external: true

volumes:
  stalwart-data:
    name: stalwart-mail-data
  stalwart-etc:
    name: stalwart-mail-etc
